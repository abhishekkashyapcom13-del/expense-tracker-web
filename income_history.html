{% extends 'base.html' %}{% block content %}<div class="page-head"><h2>Income History</h2><a class="button" href="{{url_for('index')}}">← Dashboard</a></div><div class="summary">Total Income: <b>₹{{'%.2f'|format(total)}}</b></div><section class="table-wrap"><table><thead><tr><th>ID</th><th>Amount</th><th>Date</th><th>Actions</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.id}}</td><td>₹{{'%.2f'|format(r.amount)}}</td><td>{{r.date}}</td><td><a href="{{url_for('edit_income',id=r.id)}}">Edit</a><form class="inline" method="post" action="{{url_for('delete_income',id=r.id)}}" onsubmit="return confirm('Delete this income?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4" class="empty">No income records.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
